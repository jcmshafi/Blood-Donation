version: '3.8'

services:
  # Blood Donation & Emergency Assistance Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blood_emergency_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@postgres:5432/blood_emergency_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=your_super_secret_access_token_key_change_in_production
      - JWT_REFRESH_SECRET=your_super_secret_refresh_token_key_change_in_production
      - JWT_ACCESS_EXPIRES_IN=1d
      - JWT_REFRESH_EXPIRES_IN=7d
      - BCRYPT_SALT_ROUNDS=12
      - BKASH_APP_KEY=4f6o0cjiki2rfm34kfdadl1eqq
      - BKASH_APP_SECRET=2is7hdktrekvrbljjh44ll3d9l1dtjo4pasmjvs5vl5qr3fug4b
      - BKASH_USERNAME=sandboxTokenizedUser02
      - BKASH_PASSWORD=sandboxTokenizedUser02@12345
      - BKASH_BASE_URL=https://tokenized.sandbox.bka.sh/v1.2.0-beta
      - BKASH_CALLBACK_URL=http://localhost:5000/api/v1/payments/bkash/callback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: blood_emergency_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: blood_emergency_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blood_emergency_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Rate Limit Storage
  redis:
    image: redis:7-alpine
    container_name: blood_emergency_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
